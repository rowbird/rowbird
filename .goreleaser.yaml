# GoReleaser configuration (ADR-0029). Releases are built by .github/workflows/release.yml on a
# `vX.Y.Z` tag of the public repository. Locally, `make snapshot` builds everything without
# signing or publishing.
version: 2

project_name: rowbird

before:
  hooks:
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

snapshot:
  # `ROWBIRD_SNAPSHOT_VERSION=0.9.0 make snapshot` names a private build for a soak test.
  version_template: '{{ if index .Env "ROWBIRD_SNAPSHOT_VERSION" }}{{ .Env.ROWBIRD_SNAPSHOT_VERSION }}{{ else }}{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}{{ end }}'

builds:
  - id: rowbird
    main: ./cmd/rowbird
    binary: rowbird
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/rowbird/rowbird/internal/version.Version={{ .Version }}
      - -X github.com/rowbird/rowbird/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/rowbird/rowbird/internal/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: rowbird
    ids: [rowbird]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Keyless signing with the GitHub Actions OIDC identity: the checksums file covers every archive.
  # cosign v3 writes the signature and certificate together as a Sigstore bundle.
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}

dockers_v2:
  - id: rowbird
    ids: [rowbird]
    dockerfile: Dockerfile
    images:
      - ghcr.io/rowbird/rowbird
    # Snapshots and prereleases get only their exact version.
    tags:
      - "{{ .Version }}"
      - "{{ if not (or .Prerelease .IsSnapshot) }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not (or .Prerelease .IsSnapshot) }}{{ .Major }}{{ end }}"
      - "{{ if not (or .Prerelease .IsSnapshot) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Rowbird
      org.opencontainers.image.description: Your SQL results, delivered.
      org.opencontainers.image.url: https://rowbird.dev
      org.opencontainers.image.documentation: https://docs.rowbird.dev
      org.opencontainers.image.source: https://github.com/rowbird/rowbird
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

changelog:
  use: git
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^[\w\(\)/\-]+!:'
      order: 0
    - title: Features
      regexp: '^feat(\([\w/\-]+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^fix(\([\w/\-]+\))?:'
      order: 2
    - title: Security
      regexp: '^sec(\([\w/\-]+\))?:'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.*\))?:'
      - '^test(\(.*\))?:'
      - '^chore(\(.*\))?:'
      - '^ci(\(.*\))?:'
      - '^style(\(.*\))?:'

release:
  github:
    owner: rowbird
    name: rowbird
  # A person reviews the notes and publishes the draft.
  draft: true
  prerelease: auto
  footer: |
    Images: `ghcr.io/rowbird/rowbird:{{ .Version }}` (linux/amd64, linux/arm64).
    Verify the checksums with cosign: see https://docs.rowbird.dev/install/verify
