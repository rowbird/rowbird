    patch:
      operationId: updateConnection
      tags: [connections]
      summary: Change a connection
      description: |
        `config`, when sent, replaces the whole configuration. Secret fields keep their stored value
        when absent or sent as `{ "configured": true }`, are removed when `null`, and are replaced
        by a string. The driver cannot change.
      x-rowbird-authz: { role: admin, scope: admin }
