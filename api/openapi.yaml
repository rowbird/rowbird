        has_query:
          type: boolean
        has_report:
          type: boolean
        has_delivery:
          type: boolean
          description: A delivery of the workspace was sent successfully.
    SharedLinkPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
