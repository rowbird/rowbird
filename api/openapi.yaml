        title:
          type: string
        slug:
          type: string
        description:
          type: string
        connection_id:
          type: string
          format: uuid
        sql:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/QueryParam"
        note:
          type: string
