openapi: 3.0.3
info:
  title: Rowbird API
  version: 1.0.0
  description: |
    HTTP API of Rowbird, a self-hosted service that runs SQL queries on a schedule and delivers the
    results. This document is the source of truth for the API (ADR-0005): the Go server interfaces
    and the TypeScript client are generated from it.

    Conventions (docs/spec/05-api.md):

    - Application endpoints live under `/api/v1`. Health endpoints live under `/health`.
    - IDs are UUIDv7 strings. Times are RFC 3339 in UTC.
    - Lists use cursor pagination: `?limit=50&cursor=...` returns `{ "items": [...], "next_cursor": "..." }`.
    - Errors use RFC 9457 `application/problem+json` with a stable `code` and an `i18n_key`.
    - Updates send the current `version`; a mismatch returns `409` with `code: conflict.version`.
    - Secrets are never returned. Secret fields are shown as `{ "configured": true }`.
    - State-changing requests must send `Content-Type: application/json`. Requests authenticated
      with the session cookie must also send `X-CSRF-Token` with the value of the `rowbird_csrf`
      cookie.

    Authorization is declared on each operation with `x-rowbird-authz` (ADR-0017):

    - `role`: minimum workspace role (`viewer` < `editor` < `admin`).
    - `scope`: minimum API key scope (`read` < `run` < `write` < `admin`). Sessions hold every scope.
    - `session_only`: API keys cannot call the operation (account self-service).
    - `allow_restricted`: sessions that must change their password or set up two-factor
      authentication may call it. Every other operation answers `403` with
      `auth.password_change_required` or `auth.mfa_setup_required` for such sessions.

    Operations with `security: []` are public and carry no `x-rowbird-authz`.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /
tags:
  - name: config
    description: Configuration as code (YAML export, import and the GitOps directory).
  - name: ai
    description: The AI assistant (proposals only; nothing runs by itself).
  - name: health
    description: Liveness and readiness probes. Public, never contain secrets.
  - name: setup
    description: First-run wizard. Available until the first user exists.
  - name: auth
    description: Sign in and sign out.
  - name: me
    description: The signed-in user's profile, password, sessions and two-factor authentication.
  - name: users
    description: Workspace members and their roles.
  - name: api-keys
    description: Keys for automation. Managed by admins.
  - name: settings
    description: Workspace settings.
  - name: security-events
    description: Audit trail of security-relevant actions, for admins.
  - name: system
    description: The instance itself (storage, backups, version), for admins.
  - name: plugins
    description: Installed plugins with their configuration schemas, capabilities and translations.
  - name: connections
    description: User databases. Rowbird only reads from them.
  - name: queries
    description: Named, versioned SQL bound to a connection, and its preview.
  - name: channels
    description: Destinations with their settings (email, chats, webhooks, buckets) and health.
  - name: links
    description: Shared links to run files, with expiry, revocation and a download log.
  - name: reports
    description: Queries on a schedule, with a condition, and their schedules.
  - name: runs
    description: Executions of reports, scheduled or manual.
  - name: notifications
    description: In-app notifications of the signed-in user, and the real-time event stream.

# Deny by default: every operation requires a session or an API key unless it overrides this.
security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      summary: Liveness probe
      description: Returns 200 while the process is running.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      summary: Readiness probe
      description: |
        Returns 200 when every component is healthy and 503 otherwise. The body lists each
        component (for example `store` and `migrations`) with its state.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one component is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      summary: Whether the setup wizard must run
      security: []
      responses:
        "200":
          description: Setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup:
    post:
      operationId: runSetup
      tags: [setup]
      summary: Create the first admin and sign in
      description: |
        Creates the default workspace, the first admin and the initial settings, then starts a
        session (see `login`). Answers `409 setup.completed` once any user exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: |
        On success sets the `rowbird_session` (HttpOnly) and `rowbird_csrf` cookies. When the
        account has two-factor authentication, answers `status: mfa_required` with a challenge
        token for `loginSecondFactor` instead. Errors are deliberately generic.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, or a second factor is required.
          headers:
            Set-Cookie:
              description: Session and CSRF cookies, when `status` is `authenticated`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login/second-factor:
    post:
      operationId: loginSecondFactor
      tags: [auth]
      summary: Finish signing in with a TOTP code or a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login/second-factor/passkey:
    post:
      operationId: beginPasskeySecondFactor
      tags: [auth]
      summary: Start the passkey step of a sign-in
      description: |
        For a login answered with `mfa_required` whose `methods` include `passkey`. Returns the
        options for `navigator.credentials.get`; the browser's answer goes to `loginSecondFactor`
        as `passkey`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeTokenRequest"
      responses:
        "200":
          description: The WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/passkey/options:
    post:
      operationId: beginPasskeyLogin
      tags: [auth]
      summary: Start signing in with a passkey, without a password
      description: Returns the options for `navigator.credentials.get` and a token for `passkeyLogin`. Needs `ROWBIRD_BASE_URL`.
      security: []
      responses:
        "200":
          description: The ceremony.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/passkey:
    post:
      operationId: passkeyLogin
      tags: [auth]
      summary: Finish signing in with a passkey
      description: |
        The passkey verified the user (PIN or biometrics), so it satisfies the workspace's
        two-factor requirement. Sets the session cookies like `login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAnswer"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [auth]
      summary: Leave for the identity provider (OIDC)
      description: |
        Redirects the browser to the provider with the authorization code flow and PKCE. State,
        nonce and verifier travel in a short-lived encrypted cookie. When OIDC is not available the
        browser goes back to `/login?oidc_error=<code>`.
      security: []
      parameters:
        - name: redirect
          in: query
          description: The app path to continue to after signing in.
          schema:
            type: string
      responses:
        "302":
          description: To the provider, or back to the login page with an error code.
          headers:
            Location:
              schema:
                type: string
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Come back from the identity provider
      description: |
        Exchanges the code, verifies the ID token and signs the user in: the user linked to the
        identity, else the user with the same verified email (then linked), else a new user when
        auto-provisioning allows it. Redirects to the app, or to `/login?oidc_error=<code>`.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider when the user cancelled or it refused.
          schema:
            type: string
        - name: rowbird_oidc
          in: cookie
          description: The flow cookie set by `oidcLogin`.
          schema:
            type: string
      responses:
        "302":
          description: Into the app with the session cookies, or back to the login page.
          headers:
            Location:
              schema:
                type: string
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Email a link to choose a new password
      description: |
        Always answers 202 with no body, whether or not the email belongs to an account, so it does
        not reveal who has one. When the account exists, is active and has a password, and the
        workspace has a system mailer and `ROWBIRD_BASE_URL`, a one-use link valid for 30 minutes is
        emailed (at most once every 5 minutes per account; a new request replaces earlier links).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Choose a new password with an emailed link
      description: |
        Sets the password, unlocks the account and signs the user out everywhere. It does not sign
        in; a second factor is still asked at the next sign-in. `410 auth.reset_invalid` for an
        unknown, used or expired link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirm"
      responses:
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of the current session
      x-rowbird-authz: { role: viewer, scope: read, session_only: true, allow_restricted: true }
      responses:
        "204":
          description: Signed out; cookies are cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user
      x-rowbird-authz: { role: viewer, scope: read, allow_restricted: true }
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Update name and preferences
      x-rowbird-authz: { role: viewer, scope: write, session_only: true, allow_restricted: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MePatch"
      responses:
        "200":
          description: The updated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/password:
    post:
      operationId: changeMyPassword
      tags: [me]
      summary: Change the password
      description: Requires the current password. Other sessions are signed out.
      x-rowbird-authz: { role: viewer, scope: write, session_only: true, allow_restricted: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      summary: Active sessions of the caller
      x-rowbird-authz: { role: viewer, scope: read, session_only: true }
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/sessions/{sessionId}/revoke:
    post:
      operationId: revokeMySession
      tags: [me]
      summary: Sign out one session
      x-rowbird-authz: { role: viewer, scope: write, session_only: true }
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/me/sessions/revoke-all:
    post:
      operationId: revokeAllMySessions
      tags: [me]
      summary: Sign out everywhere, including this session
      x-rowbird-authz: { role: viewer, scope: write, session_only: true }
      responses:
        "204":
          description: Every session revoked; cookies are cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/me/2fa/totp/setup:
    post:
      operationId: beginTotpSetup
      tags: [me]
      summary: Start enrolling an authenticator app
      description: Returns a new secret. It becomes active after `confirmTotpSetup`.
      x-rowbird-authz: { role: viewer, scope: write, session_only: true, allow_restricted: true }
      responses:
        "200":
          description: Enrollment data, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/2fa/totp/confirm:
    post:
      operationId: confirmTotpSetup
      tags: [me]
      summary: Activate the authenticator app with a first code
      x-rowbird-authz: { role: viewer, scope: write, session_only: true, allow_restricted: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Two-factor authentication is on. Recovery codes are shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/2fa/totp/disable:
    post:
      operationId: disableTotp
      tags: [me]
      summary: Turn off two-factor authentication
      x-rowbird-authz: { role: viewer, scope: write, session_only: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "204":
          description: Two-factor authentication is off.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/2fa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [me]
      summary: Replace the recovery codes
      x-rowbird-authz: { role: viewer, scope: write, session_only: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "200":
          description: New recovery codes, shown once. The old ones stop working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/me/passkeys:
    get:
      operationId: listMyPasskeys
      tags: [me]
      summary: The caller's passkeys
      x-rowbird-authz: { role: viewer, scope: read, session_only: true, allow_restricted: true }
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addMyPasskey
      tags: [me]
      summary: Finish adding a passkey
      x-rowbird-authz: { role: viewer, scope: write, session_only: true, allow_restricted: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistration"
      responses:
        "201":
          description: The passkey was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/passkeys/options:
    post:
      operationId: beginMyPasskeyRegistration
      tags: [me]
      summary: Start adding a passkey
      description: Requires the current password, like other changes to two-factor authentication (accounts without a password skip it).
      x-rowbird-authz: { role: viewer, scope: write, session_only: true, allow_restricted: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionalPassword"
      responses:
        "200":
          description: The options for `navigator.credentials.create` and a token for `addMyPasskey`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/me/passkeys/{passkeyId}:
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: renameMyPasskey
      tags: [me]
      summary: Rename a passkey
      x-rowbird-authz: { role: viewer, scope: write, session_only: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRename"
      responses:
        "200":
          description: The renamed passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/me/passkeys/{passkeyId}/remove:
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: removeMyPasskey
      tags: [me]
      summary: Remove a passkey
      x-rowbird-authz: { role: viewer, scope: write, session_only: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionalPassword"
      responses:
        "204":
          description: The passkey was removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Members of the workspace
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [users]
      summary: Add a user with a temporary password
      description: |
        The temporary password is returned once. The user must change it at the first sign-in.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: One member of the workspace
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change name, role or enabled state
      description: |
        Role changes and disabling sign the user out everywhere; disabling also revokes their API
        keys. The last active admin cannot be demoted or disabled (`user.last_admin`), and admins
        cannot demote or disable themselves (`user.self_modification`).
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Give the user a new temporary password
      description: Signs the user out everywhere, unlocks the account and returns the password once.
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The temporary password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{userId}/2fa/disable:
    post:
      operationId: disableUserTotp
      tags: [users]
      summary: Turn off another user's two-factor authentication
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Two-factor authentication is off for the user.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      summary: API keys of the workspace
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of keys, newest first. Keys themselves are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createApiKey
      tags: [api-keys]
      summary: Create an API key
      description: The key is returned once and cannot be retrieved later.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: Key created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/api-keys/{apiKeyId}/revoke:
    post:
      operationId: revokeApiKey
      tags: [api-keys]
      summary: Revoke an API key
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Workspace settings
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Change workspace settings
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/system/about:
    get:
      operationId: getAbout
      tags: [system]
      summary: Version of this instance and the latest release
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: The version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/system/storage:
    get:
      operationId: getStorageStatus
      tags: [system]
      summary: Artifact storage, retention and scheduled backups
      x-rowbird-authz: { role: admin, scope: admin }
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings/oidc:
    get:
      operationId: getOIDCSettings
      tags: [settings]
      summary: Single sign-on (OIDC) settings
      x-rowbird-authz: { role: admin, scope: admin }
      responses:
        "200":
          description: The settings; the client secret only as configured or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateOIDCSettings
      tags: [settings]
      summary: Change the single sign-on (OIDC) settings
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCSettingsInput"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/settings/oidc/test:
    post:
      operationId: testOIDCSettings
      tags: [settings]
      summary: Read the provider's discovery document
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCTestRequest"
      responses:
        "200":
          description: Whether the provider answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings/alerts:
    get:
      operationId: getAlertSettings
      tags: [settings]
      summary: System alert channels and the outbound heartbeat
      x-rowbird-authz: { role: admin, scope: admin }
      responses:
        "200":
          description: The settings. The heartbeat URL is secret and never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAlertSettings
      tags: [settings]
      summary: Replace the system alert and heartbeat settings
      description: |
        Alerts go to the primary channel and, when sending there fails, to the fallback. Each
        channel must support alerts; its options are validated by its destination's delivery
        schema (recipients, chat, Slack channel). Leaving `heartbeat_url` out keeps the stored
        URL, an empty string removes it.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertSettingsInput"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings/ai:
    get:
      operationId: getAISettings
      tags: [settings]
      summary: The AI assistant's provider and its settings
      x-rowbird-authz: { role: admin, scope: admin }
      responses:
        "200":
          description: 'The settings. Secret fields appear as `{ "configured": true|false }`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateAISettings
      tags: [settings]
      summary: Choose the AI provider, or turn the assistant off
      description: |
        The configuration is validated by the provider's schema (`GET /plugins`, kind
        `ai_provider`). When the provider stays the same, a secret left out or sent as the
        placeholder keeps its stored value. An empty provider turns the assistant off and removes
        the settings; without a provider nothing is ever sent to an AI service.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISettingsInput"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/settings/ai/test:
    post:
      operationId: testAISettings
      tags: [settings]
      summary: Check AI settings before saving them
      description: Checks the key and the model with the cheapest call the provider allows (usually reading the model).
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISettingsInput"
      responses:
        "200":
          description: The outcome; a failure is not an HTTP error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AITestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/ai/status:
    get:
      operationId: getAIStatus
      tags: [ai]
      summary: Whether the AI assistant is available
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/ai/generate:
    post:
      operationId: generateAIProposal
      tags: [ai]
      summary: Ask the AI assistant for a query or a schedule
      description: |
        Sends the request with the connection's dialect and cached schema, without the tables
        excluded from AI and never any rows, to the configured provider. The answer is a proposal:
        nothing is run or saved. Limited to 20 requests per 10 minutes per user on each instance.
      x-rowbird-authz: { role: editor, scope: run }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIGenerateRequest"
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/export:
    post:
      operationId: exportConfig
      tags: [config]
      summary: Export reports, queries, connections and channels as YAML
      description: |
        Without reports or queries, exports the whole workspace. Documents come in a fixed order
        with sorted keys, so exports diff cleanly in Git. Secrets are never exported: they become
        `${env:ROWBIRD_<KIND>_<NAME>_<FIELD>}` placeholders (docs/spec/09-config-as-code.md).
      x-rowbird-authz: { role: editor, scope: read }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: The YAML documents.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/import:
    post:
      operationId: importConfig
      tags: [config]
      summary: Plan or apply YAML documents
      description: |
        Parses the documents, resolves references by name (`map` points missing ones elsewhere)
        and `${env:NAME}` secrets (from `secrets`), and compares them with the workspace. With
        `dry_run` (the default) the plan is returned after a rolled-back apply, so it shows every
        error a real apply would. Otherwise the plan is applied in one transaction, or not at all.
        Problems in the documents are answered with `200` and `errors`, with file and line.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: The plan, and whether it was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/gitops/detach:
    post:
      operationId: detachFromGitOps
      tags: [config]
      summary: Let the UI change a resource the configuration directory manages
      description: The directory stops changing the resource until it is attached again.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedResource"
      responses:
        "204":
          description: Detached.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/gitops/attach:
    post:
      operationId: attachToGitOps
      tags: [config]
      summary: Give a detached resource back to the configuration directory
      description: The next apply of the directory (at startup) overwrites it again.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedResource"
      responses:
        "204":
          description: Attached.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: The signed-in user's notifications, newest first
      description: |
        Repeated occurrences of the same problem are counted on one notification (`count`,
        `last_at`) until it is resolved. `title_key` is an i18n key the client translates with
        `params`.
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: unread
          in: query
          required: false
          description: Only unread notifications.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of notifications and how many are unread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark every notification of the signed-in user as read
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: How many were marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkedCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: The notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      tags: [notifications]
      summary: Home page summary and what the health banner shows
      description: |
        Next runs, recent failed and partial runs, the success rate of the last 7 and 30 days
        (scheduled runs and manual runs that deliver; skipped runs are left out, partial runs are
        not successes), failing channels and failing reports.
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/events:
    get:
      operationId: getEvents
      tags: [notifications]
      summary: Real-time events as Server-Sent Events
      description: |
        A `text/event-stream` that stays open. Events: `run.updated` (`run_id`, `report_id`,
        `status`), `report.updated` (`report_id`), `channel.health` (`channel_id`, `ok`) and
        `notification.created` (`id`, `type`, `count`, only to its recipient). A comment line is
        sent every 15 seconds to keep proxies from closing the connection; proxies must not buffer
        this path. Events come from the instance that serves the stream, so with several
        instances clients should also refresh now and then.
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/security-events:
    get:
      operationId: listSecurityEvents
      tags: [security-events]
      summary: Security events, newest first
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          required: false
          description: Only events of this type.
          schema:
            type: string
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: Installed plugins
      description: |
        Plugins grouped by kind, each with metadata, configuration schema (a JSON Schema subset with
        `x-` extensions for order, secrets, groups and conditional fields) and capabilities, plus
        the translations of every label they use.
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: The plugin catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/connections:
    get:
      operationId: listConnections
      tags: [connections]
      summary: Connections of the workspace, by name
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: All connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createConnection
      tags: [connections]
      summary: Add a connection
      description: |
        Saves the connection, then checks it and introspects its schema. A failing check does not
        prevent saving; it is reported in `status` and `last_error`.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreate"
      responses:
        "201":
          description: The connection.
