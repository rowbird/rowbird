        link_require_login:
          type: boolean
          default: false
        options:
          type: object
          additionalProperties: true
          description: The destination's delivery options (recipients, templates, paths, ...).
    DeliveryUpdate:
      allOf:
        - $ref: "#/components/schemas/DeliveryInput"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
    Delivery:
      type: object
      required: [id, report_id, channel_id, channel_name, channel_type, position, enabled, mode, formats, inline_row_limit, include_inline_with_files, link_expires_seconds, link_require_login, options, version]
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        channel_name:
          type: string
        channel_type:
          type: string
        position:
          type: integer
        enabled:
          type: boolean
        mode:
          $ref: "#/components/schemas/DeliveryMode"
        formats:
          type: array
          items:
            type: string
        inline_row_limit:
          type: integer
        include_inline_with_files:
          type: boolean
        link_expires_seconds:
          type: integer
        link_require_login:
          type: boolean
        options:
          type: object
          additionalProperties: true
        version:
          type: integer
          format: int64
    DeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"

    DeliveryPreviewRequest:
      allOf:
        - $ref: "#/components/schemas/DeliveryInput"
        - type: object
          required: [report_id]
          properties:
            report_id:
              type: string
              format: uuid
    DeliveryPreview:
      type: object
      required: [body, body_type, attachments, links]
      properties:
        subject:
          type: string
        body:
          type: string
          description: HTML for email and Telegram (show it in a sandboxed frame), text otherwise.
        body_type:
          type: string
          enum: [html, text, json]
        attachments:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: string

    TestDeliveryRequest:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid

    DeliveryAttempt:
      type: object
      required: [id, delivery_id, channel_id, channel_name, channel_type, status, attempts, error_code, error_message, sent_at, meta, resendable, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        delivery_id:
          type: string
          format: uuid
          nullable: true
          description: Null for a test sent to the caller, or when the delivery was deleted.
        channel_id:
          type: string
          format: uuid
          nullable: true
        channel_name:
          type: string
          description: Empty when the channel was deleted.
        channel_type:
          type: string
        status:
          type: string
          enum: [pending, sending, sent, failed, skipped]
        attempts:
          type: integer
          description: Tries so far, resends included.
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
          description: The destination's message, with the channel's secrets removed.
        sent_at:
          type: string
          format: date-time
          nullable: true
        meta:
          type: object
          additionalProperties: true
          description: What was sent, such as the mode, attached files, links and fallbacks.
        resendable:
          type: boolean
          description: Whether the attempt failed and can be sent again.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RetryFailedRequest:
      type: object
      properties:
        since:
          type: string
          format: date-time

    RetryFailedResult:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer

    RunFile:
      type: object
      required: [format, file_name, content_type, size_bytes, expires_at]
      properties:
        format:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
          nullable: true

    AISettings:
      type: object
      required: [provider, config]
      properties:
        provider:
          type: string
          description: The AI provider id; empty when the assistant is off.
        config:
          type: object
          additionalProperties: true
          description: 'Settings. Secret fields appear as `{ "configured": true|false }`.'
    AISettingsInput:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: An AI provider id from `GET /plugins`, or empty to turn the assistant off.
        config:
          type: object
          additionalProperties: true
    OIDCConfig:
      type: object
      required: [enabled, issuer, client_id, scopes, button_label, auto_provision, default_role, allowed_domains]
      properties:
        enabled:
          type: boolean
        issuer:
          type: string
          description: The provider's issuer URL; discovery reads `/.well-known/openid-configuration` under it.
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: Always includes `openid`; `email` and `profile` by default.
        button_label:
          type: string
          maxLength: 60
          description: Text of the sign-in button; empty shows "Sign in with single sign-on".
        auto_provision:
          type: boolean
          description: Create a user on the first sign-in of someone without an account (email verified by the provider).
        default_role:
          type: string
          enum: [viewer, editor]
        allowed_domains:
          type: array
          items:
            type: string
          description: When not empty, only verified emails in these domains may sign in with OIDC.
    OIDCSettings:
      allOf:
        - $ref: "#/components/schemas/OIDCConfig"
        - type: object
          required: [client_secret_configured, redirect_uri, available]
          properties:
            client_secret_configured:
              type: boolean
            redirect_uri:
              type: string
              description: The address to register at the provider; empty without ROWBIRD_BASE_URL.
            available:
              type: boolean
              description: False without ROWBIRD_BASE_URL, which OIDC needs for its redirect URI.
    OIDCSettingsInput:
      allOf:
        - $ref: "#/components/schemas/OIDCConfig"
        - type: object
          properties:
            client_secret:
              type: string
              format: password
              description: Absent keeps the stored secret; empty removes it (public clients rely on PKCE).
    OIDCTestRequest:
      type: object
      required: [issuer]
      properties:
        issuer:
          type: string
    OIDCTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error_code:
          type: string
    AITestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error_code:
          type: string
          example: ai.auth_failed
        error_message:
          type: string
          description: What the service answered, with the settings' secrets removed.
    AIStatus:
      type: object
      required: [enabled, provider]
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          description: The provider id, empty when the assistant is off.
    AIGenerateRequest:
      type: object
      required: [task, prompt]
      properties:
        task:
          type: string
          enum: [query, schedule]
        prompt:
          type: string
          maxLength: 2000
        connection_id:
          type: string
          format: uuid
          description: Required for `query`; its dialect and cached schema go with the request.
        sql:
          type: string
          maxLength: 20000
          description: The editor's current SQL, for requests that change it.
        timezone:
          type: string
          description: The report's time zone (schedule) or the browser's; schedules default to it.
    AIProposal:
      type: object
      required: [task, sql, explanation, suggested_name, params, schedule, warnings, model]
      properties:
        task:
          type: string
          enum: [query, schedule]
        sql:
          type: string
          description: Empty for `schedule`.
        explanation:
          type: string
        suggested_name:
          type: string
        params:
          type: array
          description: Named parameters the SQL uses that are not built-in, suggested as text.
          items:
            $ref: "#/components/schemas/QueryParam"
        schedule:
          allOf:
            - $ref: "#/components/schemas/AISchedule"
          nullable: true
        warnings:
          type: array
          description: 'Codes: ai.warning.not_read_only, multiple_statements, schedule_invalid, schema_truncated, no_schedule.'
          items:
            type: string
        model:
          type: string
    AISchedule:
      type: object
      required: [cron, timezone, description, next]
      properties:
        cron:
          type: string
        timezone:
          type: string
        description:
          type: string
        next:
          type: array
          items:
            type: string
            format: date-time

    ExportRequest:
      type: object
      properties:
        reports:
          type: array
          items:
            type: string
          description: Report slugs; each brings its query.
        queries:
          type: array
          items:
            type: string
          description: Query slugs.
        include_connections:
          type: boolean
          default: false
        include_channels:
          type: boolean
          default: false
    ImportPolicy:
      type: string
      enum: [fail, overwrite, copy, skip]
    ImportRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
          maxLength: 5000000
        dry_run:
          type: boolean
          default: true
        policy:
          allOf:
            - $ref: "#/components/schemas/ImportPolicy"
          description: For conflicts without their own policy (default fail).
        items:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ImportPolicy"
          description: Policies by document key, such as `Report/daily-sales`.
        map:
          type: object
          additionalProperties:
            type: string
          description: Missing connection or channel names to existing ones.
        secrets:
          type: object
          additionalProperties:
            type: string
          description: Values for `${env:NAME}` placeholders, by NAME. Never stored outside the resources.
    ImportResult:
      type: object
      required: [applied, items, missing, secrets, errors]
      properties:
        applied:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportItem"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/ImportMissing"
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/ImportSecret"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ImportError"
    ImportPos:
      type: object
      required: [file, line, column]
      properties:
        file:
          type: string
        line:
          type: integer
        column:
          type: integer
    ImportItem:
      type: object
      required: [kind, name, pos, action, target, changes]
      properties:
        kind:
          type: string
          enum: [Connection, Channel, Query, Report]
        name:
          type: string
        pos:
          $ref: "#/components/schemas/ImportPos"
        action:
          type: string
          enum: [create, update, unchanged, conflict, skip]
        policy:
          $ref: "#/components/schemas/ImportPolicy"
        target:
          type: string
          description: The name after the import (differs from name for a copy).
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ImportChange"
    ImportChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
        from: {}
        to: {}
        secret:
          type: boolean
          description: A secret that changes; its values are never shown.
    ImportMissing:
      type: object
      required: [kind, name, pos]
      properties:
        kind:
          type: string
        name:
          type: string
        pos:
          $ref: "#/components/schemas/ImportPos"
    ImportSecret:
      type: object
      required: [env, kind, name, field, required, provided]
      properties:
        env:
          type: string
        kind:
          type: string
        name:
          type: string
        field:
          type: string
        required:
          type: boolean
          description: The resource is new, so the value is needed; otherwise the stored secret is kept.
        provided:
          type: boolean
    ImportError:
      type: object
      required: [pos, message]
      properties:
        pos:
          $ref: "#/components/schemas/ImportPos"
        message:
          type: string
    ManagedResource:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [connection, channel, query, report]
        id:
          type: string
          format: uuid
