      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueryVersionInfo"
    QuerySummary:
      type: object
      required: [id, managed_by, title, slug, description, connection_id, connection_name, driver, current_version, author_name, report_count, updated_at]
      properties:
        managed_by:
          $ref: "#/components/schemas/ManagedBy"
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        connection_id:
          type: string
          format: uuid
        connection_name:
          type: string
        driver:
          type: string
        current_version:
          type: integer
        author_name:
          type: string
          description: Who created the current version.
        report_count:
          type: integer
          description: Reports that use the query.
        updated_at:
          type: string
          format: date-time
    QueryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuerySummary"
    Query:
      allOf:
        - $ref: "#/components/schemas/QuerySummary"
