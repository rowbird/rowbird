          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
        user_id:
          type: string
          format: uuid
          nullable: true
        user_name:
          type: string
          nullable: true
          description: The name of the signed-in user who downloaded, when there was one.
    SharedLinkDetail:
      allOf:
        - $ref: "#/components/schemas/SharedLink"
        - type: object
          required: [downloads]
          properties:
            downloads:
              type: array
              items:
                $ref: "#/components/schemas/LinkDownload"

    DeliveryMode:
      type: string
      enum: [inline, attachment, link]
    DeliveryInput:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
        mode:
          $ref: "#/components/schemas/DeliveryMode"
        formats:
          type: array
