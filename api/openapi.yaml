        otpauth_url:
          type: string
        qr_code:
          type: string
          description: PNG data URL of the `otpauth_url` QR code.
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    User:
      type: object
      required: [id, email, name, role, locale, disabled, locked, totp_enabled, must_change_password, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
        disabled:
          type: boolean
        locked:
          type: boolean
          description: Temporarily locked after repeated failed sign-ins.
        totp_enabled:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    UserPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"
    UserCreate:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          $ref: "#/components/schemas/Locale"
    UserCreated:
      type: object
      required: [user, temporary_password]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporary_password:
          type: string
          description: Shown once. The user must change it at the first sign-in.
    UserPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
    TemporaryPassword:
      type: object
      required: [temporary_password]
      properties:
        temporary_password:
          type: string
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: First characters after `rbk_`, to recognize the key.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
    ApiKeyPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ApiKey"
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
    ApiKeyCreated:
      type: object
      required: [api_key, key]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
          description: The key, `rbk_` followed by 43 characters. Shown once.
    Settings:
      type: object
      required: [default_locale, default_timezone, require_2fa, links_enabled, retention_runs_days, retention_artifacts_days, update_check]
      properties:
        links_enabled:
          type: boolean
          readOnly: true
          description: Whether ROWBIRD_BASE_URL is set; without it deliveries cannot share links.
        default_locale:
          $ref: "#/components/schemas/Locale"
        default_timezone:
          type: string
        require_2fa:
          type: boolean
        retention_runs_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Runs older than this, with their attempts, links and files, are deleted by the daily retention job.
        retention_artifacts_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Run files older than this are deleted; their links then answer 410 Gone.
        update_check:
          type: boolean
          description: Whether this workspace allows the daily check for new Rowbird releases.
    SettingsPatch:
      type: object
      properties:
        default_locale:
          $ref: "#/components/schemas/Locale"
        default_timezone:
          type: string
        require_2fa:
          type: boolean
        retention_runs_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Runs older than this, with their attempts, links and files, are deleted by the daily retention job.
        retention_artifacts_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Run files older than this are deleted; their links then answer 410 Gone.
        update_check:
          type: boolean
          description: Whether this workspace allows the daily check for new Rowbird releases.
    About:
      type: object
      required: [version, commit, build_date, go_version, platform, update_check_allowed, update_check_enabled, update_available]
      properties:
        version:
          type: string
        commit:
          type: string
        build_date:
          type: string
        go_version:
          type: string
        platform:
          type: string
        update_check_allowed:
          type: boolean
          description: False when ROWBIRD_UPDATE_CHECK turned the check off on the server.
        update_check_enabled:
          type: boolean
          description: The workspace setting (Settings update_check).
        latest_version:
          type: string
          description: The latest release, once a check has succeeded.
        release_url:
          type: string
        checked_at:
          type: string
          format: date-time
          nullable: true
        update_available:
          type: boolean
    StorageStatus:
      type: object
      required: [backend, artifact_bytes, retention_last_run_at, backup]
      properties:
        backend:
          type: string
          enum: [local, s3]
        artifact_bytes:
          type: integer
          format: int64
          description: Size of the stored run files, across the instance.
        retention_last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When the daily retention job last finished; null before its first run.
        backup:
          $ref: "#/components/schemas/BackupStatus"
    BackupStatus:
      type: object
      description: Scheduled backups, configured with ROWBIRD_BACKUP_* on the server.
      required: [available, enabled]
      properties:
        available:
          type: boolean
          description: False with a Postgres store, which is backed up with pg_dump.
        enabled:
          type: boolean
        schedule:
          type: string
          description: The cron expression, in UTC.
        destination:
          type: string
          enum: [local, s3]
        keep:
          type: integer
        last_at:
          type: string
          format: date-time
          nullable: true
        last_file:
          type: string
        last_size_bytes:
          type: integer
          format: int64
        last_error:
          type: string
          description: Why the latest scheduled backup failed; empty when it succeeded.
        next_at:
          type: string
          format: date-time
          nullable: true
    AlertTarget:
      type: object
      required: [channel_id, options]
      properties:
        channel_id:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: true
          description: Options for the channel's destination, as in a delivery (recipients, chat, channel).
    AlertSettings:
      type: object
      required: [primary, fallback, heartbeat_url_configured, heartbeat_interval_seconds, same_destination]
      properties:
        primary:
          allOf:
            - $ref: "#/components/schemas/AlertTarget"
          nullable: true
        fallback:
          allOf:
            - $ref: "#/components/schemas/AlertTarget"
          nullable: true
        heartbeat_url_configured:
          type: boolean
        heartbeat_interval_seconds:
          type: integer
        same_destination:
          type: boolean
          description: Primary and fallback have the same type, so one outage can take both down.
    AlertSettingsInput:
      type: object
      properties:
        primary:
          allOf:
            - $ref: "#/components/schemas/AlertTarget"
          nullable: true
        fallback:
          allOf:
            - $ref: "#/components/schemas/AlertTarget"
          nullable: true
        heartbeat_url:
          type: string
          description: An absolute http(s) URL called with GET; empty removes it, absent keeps it.
        heartbeat_interval_seconds:
          type: integer
          minimum: 30
          maximum: 86400
          description: Default 60.
    SecurityEvent:
      type: object
      required: [id, type, ip, meta, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: login_failed
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        ip:
          type: string
        meta:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    SecurityEventPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
