            created_at:
              type: string
              format: date-time
            version:
              type: integer
              format: int64
    QueryCreate:
      type: object
      required: [title, connection_id, sql]
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        connection_id:
          type: string
          format: uuid
        sql:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/QueryParam"
        note:
          type: string
    QueryPatch:
      type: object
      required: [version]
      properties:
