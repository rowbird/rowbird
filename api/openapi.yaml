          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SecurityEvent"

    PluginCatalog:
      type: object
      required: [plugins, messages]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/PluginInfo"
        messages:
          type: object
          description: Locale to translation key to text, for every label used by the plugins.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    PluginInfo:
      type: object
      required: [kind, id, name, description, icon, version, schema, capabilities]
      properties:
        kind:
          type: string
          enum: [connector, formatter, condition, destination, ai_provider, storage]
        id:
          type: string
        name:
          type: string
          description: Translation key.
        description:
          type: string
          description: Translation key.
        icon:
          type: string
        version:
          type: string
        schema:
          type: object
          additionalProperties: true
          description: Configuration schema (JSON Schema subset with x- extensions).
        capabilities:
          type: object
          additionalProperties: true
        delivery_schema:
          type: object
          additionalProperties: true
          description: For destinations, the schema of each delivery's options (recipients, templates, paths).
    ConnectionStatus:
      type: string
      enum: [unknown, ok, error]
    Connection:
      type: object
      required: [id, name, managed_by, driver, config, query_timeout_seconds, max_rows, allow_multi_statement, ai_excluded_tables, status, server_version, last_error, created_at, updated_at, version]
      properties:
        managed_by:
          $ref: "#/components/schemas/ManagedBy"
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique slug-like name, used to reference the connection in YAML.
        driver:
          type: string
          description: Connector plugin id.
        config:
          type: object
          additionalProperties: true
          description: 'Settings. Secret fields appear as `{ "configured": true|false }`.'
        query_timeout_seconds:
          type: integer
        max_rows:
          type: integer
        allow_multi_statement:
          type: boolean
        ai_excluded_tables:
          type: array
          items:
            type: string
        has_write_permission:
          type: boolean
          nullable: true
          description: From the last check; null when unknown.
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        server_version:
          type: string
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          description: Error code of the last failed check, empty when it succeeded.
        schema_cached_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
    ConnectionCreate:
      type: object
      required: [name, driver, config]
      properties:
        name:
          type: string
        driver:
          type: string
        config:
          type: object
          additionalProperties: true
        query_timeout_seconds:
          type: integer
        max_rows:
          type: integer
        allow_multi_statement:
          type: boolean
        ai_excluded_tables:
          type: array
          items:
            type: string
    ConnectionPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
        config:
          type: object
          additionalProperties: true
        query_timeout_seconds:
          type: integer
        max_rows:
          type: integer
        allow_multi_statement:
          type: boolean
        ai_excluded_tables:
          type: array
          items:
            type: string
    ConnectionTest:
      type: object
      required: [driver, config]
      properties:
        connection_id:
          type: string
          format: uuid
        driver:
          type: string
        config:
          type: object
          additionalProperties: true
    ConnectionTestResult:
