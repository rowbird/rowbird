  /api/v1/reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: Reports of the workspace, by title, with their last run
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: All reports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a report and schedule its first run
      description: |
        The slug is derived from the title when omitted, the time zone defaults to the workspace's
        and every policy has a default. `param_overrides` must be user parameters of the query's
        current version, and parameters without a default need a value.
      x-rowbird-authz: { role: editor, scope: write }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "201":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/reports/{reportId}:
    get:
      operationId: getReport
      tags: [reports]
      summary: One report
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Change a report
      description: Changing `cron` or `timezone` recomputes the next run from now.
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPatch"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report and its runs
      description: A report with a pending or running run cannot be deleted (`report.run_active`).
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "204":
          description: Deleted with its runs.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/reports/{reportId}/pause:
    post:
      operationId: pauseReport
      tags: [reports]
      summary: Stop scheduling a report
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The paused report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/{reportId}/resume:
    post:
      operationId: resumeReport
      tags: [reports]
      summary: Schedule a paused report again from now
      description: Also clears the failure streak that may have paused it.
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/{reportId}/run:
    post:
      operationId: runReport
      tags: [reports]
      summary: Queue a manual run
      description: |
        Runs the report now, even when it is paused or another run is in progress. With
        `deliver: false` the run only shows its result: nothing is delivered and it never counts
        toward failures or the `changed` condition. Repeating a request with the same
        `Idempotency-Key` within 24 hours returns the first run with status 200.
      x-rowbird-authz: { role: editor, scope: run }
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: The run already created with this idempotency key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "202":
          description: The queued run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/schedules/preview:
    post:
      operationId: previewSchedule
      tags: [reports]
      summary: Next occurrences and description of a schedule
      description: |
        Five-field cron or @hourly, @daily, @weekly, @monthly, @yearly. Occurrences are computed in
        the time zone: a local time skipped by daylight saving runs at the end of the gap, a
        repeated one runs once.
      x-rowbird-authz: { role: viewer, scope: read }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Runs, newest first
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: report_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Only runs with one of these statuses.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
        - name: trigger
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunTrigger"
        - name: from
          in: query
          required: false
          description: Runs created at or after this time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Runs created before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: One run with its steps, parameters, condition and result sample
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a pending or running run
      description: |
        A pending run is cancelled at once. A running run is asked to stop: its query is cancelled on
        the database server and the run ends as `cancelled` shortly after.
      x-rowbird-authz: { role: editor, scope: run }
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/runs/{runId}/attempts/{attemptId}/retry:
    post:
      operationId: retryAttempt
      tags: [runs]
      summary: Send a failed delivery attempt again
      description: |
        Uses the run's stored files, without running the query again. The attempt's status goes
        back to sending and its new tries add to its count. When every attempt of a partial run has
        been sent, the run becomes a success.
      x-rowbird-authz: { role: editor, scope: run }
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: The attempt after the resend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/runs/{runId}/result:
    get:
      operationId: downloadRunResult
      tags: [runs]
      summary: The run's result as a file
      description: |
        When the run delivered the format, the stored file is returned exactly as it was sent (see
        the run's `files`, kept for `retention_artifacts_days`). Otherwise the result is available
        for a day after a run that succeeded, was partial or was skipped (see `result_expires_at`),
        and the file is generated on request with the caller's language and the report's time zone,
        with the formatter's default options. Only file formatters are accepted.
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: format
          in: query
          required: false
          description: |
            A file formatter id from `GET /plugins`, such as `csv`, `xlsx`, `json` or `pdf`. Required;
            declared optional so that authentication is checked before the request.
          schema:
            type: string
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: Attachment with the file name, `<report slug>-<date>.<extension>`.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /api/v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Channels of the workspace, by name, with their health
      x-rowbird-authz: { role: viewer, scope: read }
      responses:
        "200":
          description: All channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a channel
      description: Channels hold credentials, so only admins manage them.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/channels/test:
    post:
      operationId: testChannelConfig
      tags: [channels]
      summary: Test unsaved channel settings
      description: |
        With `channel_id`, secret placeholders resolve from that saved channel. Email channels send
        the test message to `to`, or to their own sender address.
      x-rowbird-authz: { role: admin, scope: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelTest"
      responses:
        "200":
          description: The outcome; a failure is not an HTTP error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/channels/{channelId}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: One channel
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Change a channel
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelPatch"
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete a channel that no delivery uses
      x-rowbird-authz: { role: admin, scope: admin }
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/channels/{channelId}/test:
    post:
      operationId: testChannel
      tags: [channels]
      summary: Send a test message through a saved channel
      description: Records the outcome as the channel's health.
      x-rowbird-authz: { role: editor, scope: run }
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelTestRequest"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{channelId}/retry-failed:
    post:
      operationId: retryFailedDeliveries
      tags: [channels]
      summary: Send a channel's failed delivery attempts again
      description: |
        Queues the channel's failed attempts created since `since` (24 hours ago by default), at
        most 100, and resends them in the background with each run's stored files.
      x-rowbird-authz: { role: editor, scope: run }
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryFailedRequest"
      responses:
        "202":
          description: How many attempts were queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryFailedResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/links:
    get:
      operationId: listLinks
      tags: [links]
      summary: Shared links, newest first
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: run_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          description: Only links that are neither expired nor revoked.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedLinkPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/links/{linkId}:
    get:
      operationId: getLink
      tags: [links]
      summary: One link with its latest downloads
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedLinkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/links/{linkId}/revoke:
    post:
      operationId: revokeLink
      tags: [links]
      summary: Revoke a link at once
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The revoked link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedLinkDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/reports/{reportId}/deliveries:
    get:
      operationId: listDeliveries
      tags: [reports]
      summary: A report's deliveries, in order
      x-rowbird-authz: { role: viewer, scope: read }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createDelivery
      tags: [reports]
      summary: Add a delivery to a report
      description: |
        The mode must be one the channel's destination supports; `link` needs `ROWBIRD_BASE_URL`.
        `options` are validated by the destination's delivery schema (see `GET /plugins`).
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryInput"
      responses:
        "201":
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/reports/{reportId}/deliveries/{deliveryId}:
    put:
      operationId: updateDelivery
      tags: [reports]
      summary: Replace a delivery's settings
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/DeliveryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryUpdate"
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteDelivery
      tags: [reports]
      summary: Remove a delivery
      x-rowbird-authz: { role: editor, scope: write }
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "204":
          description: Removed; its past attempts stay on their runs.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/deliveries/preview:
    post:
      operationId: previewDelivery
      tags: [reports]
      summary: Render a delivery's message without sending it
      description: |
        Uses the report's latest result (its first rows). Nothing is sent, no link is created and no
        file is stored; attachments and links are shown by name.
      x-rowbird-authz: { role: editor, scope: run }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryPreviewRequest"
      responses:
        "200":
          description: The rendered message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/reports/{reportId}/test-delivery:
    post:
      operationId: testDelivery
      tags: [reports]
      summary: Run the report now and deliver it only to the caller
      description: |
        Without `channel_id`, sends an email to the caller through the system mailer, with the
        report's file formats. With it, delivers through the report's deliveries on that channel.
        The run has trigger `test`, delivers even when the condition does not hold and never counts
        toward failures.
      x-rowbird-authz: { role: editor, scope: run }
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestDeliveryRequest"
      responses:
        "202":
          description: The queued test run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rowbird_session
      description: |
        Browser session. State-changing requests must also send the `X-CSRF-Token` header
        (see `csrfToken`).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token required with `sessionCookie` on state-changing requests.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: rbk_<random>
      description: API key with scopes `read`, `run`, `write` or `admin`.

  parameters:
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryId:
      name: queryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a run or test request safe to retry for 24 hours.
      schema:
        type: string
        maxLength: 255

  responses:
    SignedIn:
      description: Signed in. Sets the `rowbird_session` and `rowbird_csrf` cookies.
      headers:
        Set-Cookie:
          description: Session and CSRF cookies.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
    TooManyRequests:
      description: Too many attempts. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The resource existed but is no longer available.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request is valid but the operation failed, for example the database refused the connection.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is invalid. `errors` lists the offending fields.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource changed since it was read (`conflict.version`) or a unique value is taken.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, extended with a stable code and an i18n key.
      required: [type, title, status, code, i18n_key]
      properties:
        type:
          type: string
          description: URI identifying the problem type, `https://rowbird.dev/errors/<code>`.
          example: https://rowbird.dev/errors/connection.auth_failed
        title:
          type: string
          description: Short human-readable summary in the request locale.
          example: Authentication failed
        status:
          type: integer
          description: HTTP status code.
          example: 422
        code:
          type: string
          description: Stable machine-readable error code.
          example: connection.auth_failed
        i18n_key:
          type: string
          description: Translation key clients can use to show their own message.
          example: errors.connection.auth_failed
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: Request path that produced the problem.
        request_id:
          type: string
          description: Id of the request, also sent in the `X-Request-ID` header.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            $ref: "#/components/schemas/FieldError"
        dependents:
          type: array
          description: What uses the resource, for "in use" conflicts.
          items:
            $ref: "#/components/schemas/Dependent"
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Path of the offending field, for example `port` or `deliveries[0].mode`.
          example: port
        code:
          type: string
          description: Stable validation code.
          example: validation.range
    CursorPage:
      type: object
      description: |
        Pagination envelope. List responses combine it with an `items` array through `allOf`.
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null on the last page.
    SecretField:
      type: object
      description: Placeholder returned instead of a secret. Sending it back means "unchanged".
      required: [configured]
      properties:
        configured:
          type: boolean
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        components:
          type: object
          description: State of each component, keyed by component name.
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
    ComponentStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
          description: Short explanation when the component is unhealthy. Never contains secrets.

    Role:
      type: string
      enum: [viewer, editor, admin]
    Scope:
      type: string
      enum: [read, run, write, admin]
      description: API key scope. Each scope includes the ones before it.
    Locale:
      type: string
      enum: [en, pt-BR]
    Theme:
      type: string
      enum: [system, light, dark]
    Restriction:
      type: string
      enum: [none, password_change_required, mfa_setup_required]
      description: What the session must do before it can use the rest of the API.
    SetupStatus:
      type: object
      required: [setup_required, token_required, master_key, passkeys_available, oidc_enabled, password_reset_available]
      properties:
        passkeys_available:
          type: boolean
          description: Passkeys can be used (they need ROWBIRD_BASE_URL).
        password_reset_available:
          type: boolean
          description: The login page offers "forgot password" (a system mailer and ROWBIRD_BASE_URL exist).
        oidc_enabled:
          type: boolean
          description: The login page offers single sign-on.
        oidc_label:
          type: string
          description: The text of the single sign-on button, when set.
        setup_required:
          type: boolean
        token_required:
          type: boolean
          description: The wizard must send the value of `ROWBIRD_SETUP_TOKEN`.
        master_key:
          $ref: "#/components/schemas/MasterKeyInfo"
    MasterKeyInfo:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [env, file, generated]
          description: |
            Where the master key comes from. `generated` means Rowbird created it in the data
            directory; it must be backed up because encrypted credentials cannot be recovered
            without it.
        path:
          type: string
          description: Location of the generated key file. Only present while setup is pending.
    SetupRequest:
      type: object
      required: [email, name, password, locale, timezone]
      properties:
        token:
          type: string
        email:
          type: string
        name:
          type: string
        password:
          type: string
          format: password
        locale:
          $ref: "#/components/schemas/Locale"
        timezone:
          type: string
          description: IANA time zone, for example `America/Sao_Paulo`.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The `rbr_` token from the emailed link.
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required]
        challenge_token:
          type: string
          description: Present when `status` is `mfa_required`. Valid for 5 minutes.
        methods:
          type: array
          description: Present when `status` is `mfa_required`; the second factors the account has.
          items:
            type: string
            enum: [totp, passkey]
        me:
          $ref: "#/components/schemas/Me"
    SecondFactorRequest:
      type: object
      required: [challenge_token]
      description: Either `code` or `passkey`.
      properties:
        challenge_token:
          type: string
        code:
          type: string
          description: A six-digit TOTP code or a recovery code.
        passkey:
          type: object
          additionalProperties: true
          description: The answer of `navigator.credentials.get` to `beginPasskeySecondFactor`, as JSON.
    ChallengeTokenRequest:
      type: object
      required: [challenge_token]
      properties:
        challenge_token:
          type: string
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options (the `publicKey` member), with binary values in base64url.
    PasskeyCeremony:
      type: object
      required: [challenge_token, options]
      properties:
        challenge_token:
          type: string
          description: Ties the browser's answer to this ceremony. Valid for 5 minutes, once.
        options:
          type: object
          additionalProperties: true
          description: WebAuthn options (the `publicKey` member), with binary values in base64url.
    PasskeyAnswer:
      type: object
      required: [challenge_token, credential]
      properties:
        challenge_token:
          type: string
        credential:
          type: object
          additionalProperties: true
          description: The answer of `navigator.credentials.get`, as JSON.
    PasskeyRegistration:
      type: object
      required: [challenge_token, credential]
      properties:
        challenge_token:
          type: string
        name:
          type: string
          maxLength: 100
          description: A name to recognize the passkey by ("Work laptop"); "Passkey" when empty.
        credential:
          type: object
          additionalProperties: true
          description: The answer of `navigator.credentials.create`, as JSON.
    PasskeyRename:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
    OptionalPassword:
      type: object
      properties:
        password:
          type: string
          format: password
          description: The current password; required for accounts that have one.
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at, synced]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        synced:
          type: boolean
          description: The passkey can be synced between devices (backup eligible).
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
    Me:
      type: object
      required: [id, email, name, locale, theme, role, totp_enabled, has_password, restriction, version, created_at]
      properties:
        has_password:
          type: boolean
          description: False for accounts that only sign in through OIDC; they skip password confirmations.
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"
        theme:
          $ref: "#/components/schemas/Theme"
        role:
          $ref: "#/components/schemas/Role"
        totp_enabled:
          type: boolean
        restriction:
          $ref: "#/components/schemas/Restriction"
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    MePatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
        locale:
          $ref: "#/components/schemas/Locale"
        theme:
          $ref: "#/components/schemas/Theme"
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    Session:
      type: object
      required: [id, ip, user_agent, created_at, last_seen_at, expires_at, current]
