          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createQuery
      tags: [queries]
      summary: Create a query and its first version
      description: The slug is derived from the title when omitted.
      x-rowbird-authz: { role: editor, scope: write }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryCreate"
      responses:
        "201":
          description: The query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Query"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/queries/preview:
    post:
      operationId: previewQuery
      tags: [queries]
      summary: Run SQL read-only with a row cap and a short timeout
      description: |
        Nothing is saved. Parameters are bound as driver parameters. Built-in dates are resolved in
        `timezone` (the browser's), falling back to the workspace default. Rows use the column
        types: integers beyond 2^53 and decimals arrive as strings, binary values as base64, dates
        and times as ISO 8601 text.
      x-rowbird-authz: { role: editor, scope: run }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
