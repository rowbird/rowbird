    PreviewRequest:
      type: object
      required: [connection_id, sql]
      properties:
        connection_id:
          type: string
          format: uuid
        sql:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/QueryParam"
        values:
          type: object
          additionalProperties:
            type: string
          description: Parameter values in text form; defaults apply to missing ones.
        timezone:
          type: string
          description: IANA time zone for built-in dates, usually the browser's.
        limit:
          type: integer
          minimum: 0
          maximum: 1000
          description: Row cap; 0 or missing means 100. Never above the connection's max_rows.
    ResultColumn:
      type: object
      required: [name, type, db_type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, integer, decimal, float, boolean, date, datetime, time, json, binary, unknown]
        db_type:
          type: string
        with_time_zone:
          type: boolean
    ResolvedParam:
      type: object
      required: [name, type, value, builtin]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/ParamType"
        value:
          type: string
        builtin:
          type: boolean
    PreviewResult:
      type: object
      required: [columns, rows, truncated, duration_ms, params, timezone]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ResultColumn"
        rows:
          type: array
          items:
            type: array
            items: {}
        truncated:
          type: boolean
          description: More rows existed beyond the cap.
        duration_ms:
          type: integer
          format: int64
        params:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedParam"
        timezone:
          type: string

    ConditionRule:
      type: object
      required: [type]
      description: A condition plugin id and that plugin's parameters (see `GET /plugins`, kind `condition`).
      properties:
        type:
          type: string
          example: row_count
      additionalProperties: true
    Condition:
      type: object
      required: [match, rules]
      description: Rules combined with `all` or `any`. No rules means the report always delivers.
      properties:
        match:
          type: string
          enum: [all, any]
        rules:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConditionRule"
    ReportStatus:
      type: string
      enum: [active, paused, failing]
    PausedReason:
      type: string
      enum: [manual, auto_failures, gitops_orphan]
    ManagedBy:
      type: string
      enum: ["", gitops, gitops_detached]
      description: |
        Who manages the resource: empty for the UI and the API, `gitops` for the configuration
        directory (read only: changes answer `409 resource.managed_by_gitops`), `gitops_detached`
        for one an admin detached (the directory leaves it alone).
    MisfirePolicy:
      type: string
      enum: [run_once, skip]
    OverlapPolicy:
      type: string
      enum: [skip, queue]
    ReportSummary:
      type: object
      required: [id, managed_by, gitops_orphan, title, slug, description, query_id, query_title, enabled, status, cron, timezone, next_run_at, paused_reason, consecutive_failures, last_run, updated_at]
      properties:
        gitops_orphan:
          type: boolean
          description: A GitOps report whose document left the configuration directory; paused until it returns.
        managed_by:
          $ref: "#/components/schemas/ManagedBy"
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        query_id:
          type: string
          format: uuid
        query_title:
          type: string
        enabled:
          type: boolean
        status:
          $ref: "#/components/schemas/ReportStatus"
        cron:
          type: string
        timezone:
          type: string
        next_run_at:
          type: string
          format: date-time
          nullable: true
        paused_reason:
          allOf:
            - $ref: "#/components/schemas/PausedReason"
          nullable: true
        consecutive_failures:
          type: integer
        last_run:
          allOf:
            - $ref: "#/components/schemas/RunSummary"
          nullable: true
        updated_at:
          type: string
          format: date-time
    ReportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportSummary"
    Report:
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          required: [condition, param_overrides, max_rows, retry_max, retry_backoff_seconds, misfire_policy, overlap_policy, auto_pause_after, notify_owner_on_failure, created_at, version]
          properties:
            condition:
              $ref: "#/components/schemas/Condition"
            param_overrides:
              type: object
              additionalProperties:
                type: string
            max_rows:
              type: integer
              nullable: true
              description: Row limit for this report; null uses the connection's.
            retry_max:
              type: integer
            retry_backoff_seconds:
              type: integer
            misfire_policy:
              $ref: "#/components/schemas/MisfirePolicy"
            overlap_policy:
              $ref: "#/components/schemas/OverlapPolicy"
            auto_pause_after:
              type: integer
              description: Consecutive failed runs that pause the report; 0 never pauses.
            notify_owner_on_failure:
              type: boolean
            created_at:
              type: string
              format: date-time
            version:
              type: integer
              format: int64
    ReportCreate:
      type: object
      required: [title, query_id, cron]
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        query_id:
          type: string
          format: uuid
        enabled:
          type: boolean
          default: true
        cron:
          type: string
          example: "0 7 * * 1-5"
        timezone:
          type: string
          description: IANA time zone; the workspace default when omitted.
        condition:
          $ref: "#/components/schemas/Condition"
        param_overrides:
          type: object
          additionalProperties:
            type: string
        max_rows:
          type: integer
          minimum: 0
          description: 0 or missing uses the connection's limit.
        retry_max:
          type: integer
          minimum: 0
          maximum: 10
          default: 2
        retry_backoff_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 30
        misfire_policy:
          $ref: "#/components/schemas/MisfirePolicy"
        overlap_policy:
          $ref: "#/components/schemas/OverlapPolicy"
        auto_pause_after:
          type: integer
          minimum: 0
          maximum: 100
          default: 5
        notify_owner_on_failure:
          type: boolean
          default: true
    ReportPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        query_id:
          type: string
          format: uuid
        cron:
          type: string
        timezone:
          type: string
        condition:
          $ref: "#/components/schemas/Condition"
        param_overrides:
          type: object
          additionalProperties:
            type: string
        max_rows:
          type: integer
          minimum: 0
          description: 0 removes the report's limit and uses the connection's.
        retry_max:
          type: integer
        retry_backoff_seconds:
          type: integer
        misfire_policy:
          $ref: "#/components/schemas/MisfirePolicy"
        overlap_policy:
          $ref: "#/components/schemas/OverlapPolicy"
        auto_pause_after:
          type: integer
        notify_owner_on_failure:
          type: boolean
    ScheduleRequest:
      type: object
      required: [cron]
      properties:
        cron:
          type: string
        timezone:
          type: string
          description: IANA time zone; the workspace default when omitted.
        count:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        locale:
          type: string
          description: Language of the description (`en` or `pt-BR`).
          default: en
    SchedulePreview:
      type: object
      required: [expression, timezone, description, next]
      properties:
        expression:
          type: string
          description: The normalized expression.
        timezone:
          type: string
        description:
          type: string
          description: Human description; empty when the expression cannot be described.
        next:
          type: array
          items:
            type: string
            format: date-time
    RunStatus:
      type: string
      enum: [pending, running, success, partial, skipped, failed, cancelled]
    RunTrigger:
      type: string
      enum: [schedule, manual, test, retry]
    RunRequest:
      type: object
      properties:
        deliver:
          type: boolean
          default: true
          description: False only shows the result.
    RunSummary:
      type: object
      required: [id, report_id, report_title, trigger, triggered_by_name, deliver, status, scheduled_for, started_at, finished_at, duration_ms, row_count, truncated, attempt, error_code, created_at]
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        report_title:
          type: string
        trigger:
          $ref: "#/components/schemas/RunTrigger"
        triggered_by_name:
          type: string
          nullable: true
        deliver:
          type: boolean
        status:
          $ref: "#/components/schemas/RunStatus"
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          format: int64
          nullable: true
        row_count:
          type: integer
          format: int64
          nullable: true
        truncated:
          type: boolean
        attempt:
          type: integer
        error_code:
          type: string
          nullable: true
          description: Why the run failed, was skipped or cancelled (`run.condition_false`, `connection.auth_failed`, ...).
        created_at:
          type: string
          format: date-time
    RunPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RunSummary"
    RuleResult:
      type: object
      required: [type, passed]
      properties:
        type:
          type: string
        passed:
          type: boolean
        detail:
          type: object
          additionalProperties: true
    ConditionResult:
      type: object
      required: [passed, match, rules]
      properties:
        passed:
          type: boolean
        match:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleResult"
    RunParams:
      type: object
      required: [timezone, values]
      properties:
        timezone:
          type: string
        values:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedParam"
    RunQuery:
      type: object
      required: [query_id, version, sql]
      description: The query version the run executed.
      properties:
        query_id:
          type: string
          format: uuid
        version:
          type: integer
        sql:
          type: string
    RunSample:
      type: object
      required: [columns, rows]
      description: The first rows of the result (at most 100), encoded like the preview.
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ResultColumn"
        rows:
          type: array
          items:
            type: array
            items: {}
    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required: [error_message, query, params, condition, sample, cancel_requested_at, result_expires_at, deliveries, files]
          properties:
            files:
              type: array
              description: The files the run's deliveries generated, downloadable until they expire.
              items:
                $ref: "#/components/schemas/RunFile"
            deliveries:
              type: array
              description: One attempt per delivery the run sent (or tried to send).
              items:
                $ref: "#/components/schemas/DeliveryAttempt"
            error_message:
              type: string
              nullable: true
              description: The database's message, with the connection's secrets removed.
            query:
              allOf:
                - $ref: "#/components/schemas/RunQuery"
              nullable: true
            params:
              allOf:
                - $ref: "#/components/schemas/RunParams"
              nullable: true
            condition:
              allOf:
                - $ref: "#/components/schemas/ConditionResult"
              nullable: true
            sample:
              allOf:
                - $ref: "#/components/schemas/RunSample"
              nullable: true
            cancel_requested_at:
              type: string
              format: date-time
              nullable: true
            result_expires_at:
              type: string
              format: date-time
              nullable: true
              description: Until when the result can be downloaded; null when it cannot.

    ChannelStatus:
      type: string
      enum: [unknown, ok, failing]
    Channel:
      type: object
      required: [id, name, managed_by, type, config, capabilities, status, is_system_mailer, used_by, created_at, updated_at, version]
      properties:
        managed_by:
          $ref: "#/components/schemas/ManagedBy"
        capabilities:
          type: object
          additionalProperties: true
          description: The destination's capabilities with this channel's settings (modes, attachment limit, inline target).
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique slug-like name, used to reference the channel in YAML.
        type:
          type: string
          description: Destination plugin id.
        config:
          type: object
          additionalProperties: true
          description: 'Settings. Secret fields appear as `{ "configured": true|false }`.'
        status:
          $ref: "#/components/schemas/ChannelStatus"
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
          description: The last failure, with the channel's secrets removed.
        is_system_mailer:
          type: boolean
          description: Sends system mail (password resets, "send test to me"). One email channel at most.
        used_by:
          type: array
          items:
            $ref: "#/components/schemas/Dependent"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    ChannelCreate:
      type: object
      required: [name, type, config]
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        is_system_mailer:
          type: boolean
    ChannelPatch:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Replaces the settings; secrets follow the placeholder rules.
        is_system_mailer:
          type: boolean
    ChannelTest:
      type: object
      required: [type, config]
      properties:
        channel_id:
          type: string
          format: uuid
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        to:
          type: string
          description: Where an email channel sends the test message.
    ChannelTestRequest:
      type: object
      properties:
        to:
          type: string
          description: Where an email channel sends the test message; the caller's address by default.
    ChannelTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error_code:
          type: string
          example: delivery.auth_failed
        error_message:
          type: string
          description: What the service answered, with the channel's secrets removed.

    SharedLink:
      type: object
      required: [id, run_id, report_id, report_title, file_name, format, status, expires_at, require_login, download_count, created_at]
      description: A shared link. Its token is shown only in the message that carried it.
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        report_title:
          type: string
        delivery_id:
          type: string
          format: uuid
          nullable: true
        file_name:
          type: string
        format:
          type: string
        status:
          type: string
          enum: [active, expired, revoked]
        expires_at:
          type: string
          format: date-time
        require_login:
          type: boolean
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by_name:
          type: string
          nullable: true
        download_count:
          type: integer
        last_download_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationSeverity:
      type: string
      enum: [info, warning, error]
    Notification:
      type: object
      required: [id, type, severity, title_key, params, entity_type, entity_id, count, first_at, last_at, read_at, resolved_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: channel_failing, channel_recovered, report_failing, report_recovered or report_paused.
        severity:
          $ref: "#/components/schemas/NotificationSeverity"
        title_key:
          type: string
        params:
          type: object
          additionalProperties: true
        entity_type:
          type: string
          description: What the notification is about (`channel`, `report`), empty for none.
        entity_id:
          type: string
          format: uuid
          nullable: true
        count:
          type: integer
          description: How many times it happened while the notification was open.
        first_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When the problem ended; notices such as recoveries are resolved from the start.
    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items, unread_count]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Notification"
            unread_count:
              type: integer
    MarkedCount:
      type: object
      required: [marked]
      properties:
        marked:
          type: integer
    SuccessRate:
      type: object
      required: [succeeded, total]
      properties:
        succeeded:
          type: integer
        total:
          type: integer
    DashboardReport:
      type: object
      required: [id, title, next_run_at, timezone, consecutive_failures, paused_reason]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        next_run_at:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
        consecutive_failures:
          type: integer
        paused_reason:
          type: string
          nullable: true
    DashboardChannel:
      type: object
      required: [id, name, type, last_error, last_failure_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        last_error:
          type: string
          nullable: true
        last_failure_at:
          type: string
          format: date-time
          nullable: true
    Dashboard:
      type: object
      required: [next_runs, recent_failures, success_rate_7d, success_rate_30d, failing_channels, failing_reports, onboarding]
      properties:
        onboarding:
