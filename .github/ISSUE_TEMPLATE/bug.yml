name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Remove passwords, tokens and connection strings from everything you paste.
  - type: input
    id: version
    attributes:
      label: Rowbird version
      description: The output of `rowbird version`, or Settings > About.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker, Docker Compose, Binary, Kubernetes, Other]
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Internal store
      options: [SQLite, PostgreSQL]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (with `run_id` for run problems).
      render: text
